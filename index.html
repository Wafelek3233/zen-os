<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zen OS — Maintenance</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#040209;
    color:#e8ecf4;
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;text-align:center;padding:24px;
  }
  .logo{font-size:13px;font-weight:800;letter-spacing:.16em;margin-bottom:32px;opacity:.5}
  h1{font-size:clamp(32px,6vw,64px);font-weight:800;letter-spacing:.04em;
     background:linear-gradient(100deg,#fff 20%,#c4b5fd 50%,#93c5fd 70%,#fff 90%);
     background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
     color:transparent;animation:shine 6s linear infinite;margin-bottom:16px}
  @keyframes shine{to{background-position:200% 0}}
  p{color:#9aa4b6;font-size:16px;line-height:1.6;max-width:460px;margin:0 auto}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
       background:#8b5cf6;box-shadow:0 0 12px #8b5cf6;
       animation:pulse 2s ease-in-out infinite;margin-right:8px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<!-- ZEN_MAINTENANCE_MODE -->
<div>
  <div class="logo">ZEN OS</div>
  <h1>Back soon.</h1>
  <p><span class="dot"></span>The site is temporarily down for maintenance.<br>
  Check back in a few minutes.</p>
</div>
</body>
</html>
